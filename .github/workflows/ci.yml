name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: API TypeScript validation
        run: npm --workspace apps/api run typecheck

      - name: API tests
        run: npm --workspace apps/api run test

      - name: Web TypeScript validation
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Web tests
        run: npm --workspace apps/web run test

      - name: Web production build
        run: npm --workspace apps/web run build
        env:
          VITE_GEOTAB_DATABASE: opex_trial

      - name: Deployment configuration validation
        run: node --experimental-strip-types apps/api/test/deployment-config.test.mjs

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
